<!DOCTYPE html>
<html lang="om"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Naol Studio</title>
<style>
:root{--bg:#121212;--p2:#2a2a2d;--a:#00d1e0;--m:#8b8b90}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:#fff;font:13px system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
button,select,input[type=number]{background:var(--p2);color:#fff;border:0;border-radius:8px;padding:8px 11px;font:inherit}
.ic{background:none;font-size:22px;padding:6px 9px}
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;height:54px;padding-top:max(8px,env(safe-area-inset-top))}
#top .sp{flex:1}
#exp{background:var(--a);color:#000;font-weight:700;font-size:15px;padding:9px 16px}
#stage{flex:1;position:relative;min-height:0;background:#000}
#vz{width:100%;height:100%;display:block}
#tr{display:flex;align-items:center;justify-content:space-between;padding:4px 12px;height:44px}
#tm{font-size:13px;width:110px}#tm i{color:var(--m);font-style:normal}
#pl{font-size:26px}
#tl{height:190px;width:100%;display:block;touch-action:none;background:#121212}
#tb{display:flex;overflow-x:auto;gap:2px;padding:6px;border-top:1px solid #222;background:#121212}
.tbn{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;background:none;gap:3px;font-size:11px;color:#ddd;padding:6px 0}
.tbn i{font-style:normal;font-size:22px}
.pn{position:absolute;inset:0;background:#141416f7;overflow:auto;padding:8px 10px;display:none;z-index:2}.pn.on{display:block}
.ph{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
label{display:flex;gap:6px;align-items:center;font-size:12px}input[type=range]{accent-color:var(--a);flex:1;min-width:70px}
.big{background:#fe2c55;font-weight:700}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:250px;margin:6px auto;perspective:600px}
.pad{aspect-ratio:1;border-radius:10px;color:#000b;font-weight:700;font-size:10px;padding:0;background:var(--c);box-shadow:0 5px 0 #0009,0 0 12px var(--c);transform:rotateX(16deg);opacity:.85;touch-action:none}
.pad.f{transform:rotateX(16deg) translateY(4px);box-shadow:0 1px 0 #0009,0 0 34px var(--c);filter:brightness(1.4);opacity:1}
#seq{display:grid;grid-template-columns:repeat(16,1fr);gap:2px}#seq b{height:22px;background:#2a2a2d;border-radius:3px}#seq b.on{background:var(--a)}#seq b.cu{outline:1px solid #fff}
#kw{overflow-x:auto;overflow-y:hidden;padding:4px 0}#kk{position:relative;height:150px}
.key{position:absolute;top:0;touch-action:none}
.w{width:44px;height:150px;background:linear-gradient(#fff,#ccd);border-radius:0 0 6px 6px;border:1px solid #333}
.b{width:30px;height:95px;background:linear-gradient(#333,#000);border-radius:0 0 5px 5px;z-index:2;box-shadow:2px 3px 5px #000}
.key.f{background:var(--a)}.key.off{opacity:.35}
.fret{display:grid;grid-template-columns:repeat(13,1fr);background:linear-gradient(#5a3a1e,#3a2212);padding:6px;border-radius:10px;touch-action:none}
.fret b{height:32px;border-bottom:2px solid #ddd;color:#fff7;font-size:9px;text-align:center;border-right:1px solid #0005;display:block}.fret b.f{background:#00d1e066}
#decks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.deck{background:var(--p2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;align-items:center}
.deck .row{margin:0;justify-content:center}.deck button{padding:5px 8px;font-size:11px}.deck input[type=file]{width:100%;font-size:10px}
.plat{width:min(110px,28vw);aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(#111 0 3px,#1c1c1c 3px 6px);border:4px solid #444;animation:sp 1.8s linear infinite;animation-play-state:paused;display:grid;place-items:center}
.plat i{width:30%;height:30%;border-radius:50%;background:conic-gradient(#00d1e0,#fe2c55,#00d1e0)}.plat.on{animation-play-state:running}
@keyframes sp{to{transform:rotate(360deg)}}
#rib{height:150px;border-radius:14px;background:linear-gradient(90deg,#102,#00d1e033,#fe2c5533);position:relative;touch-action:none;border:1px solid var(--a)}
#dot{position:absolute;width:40px;height:40px;border-radius:50%;background:var(--a);box-shadow:0 0 30px var(--a);transform:translate(-50%,-50%);opacity:0}
#fx{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cd{background:var(--p2);border-radius:8px;padding:7px;display:flex;flex-wrap:wrap;gap:2px}.cd span{flex:1;font-size:11px}.cd input{width:100%}

:root{--tbh:76px}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ic{display:flex;align-items:center;color:#e6e6e6}.ic svg{width:26px;height:26px}
#top{height:58px}#q{font-weight:600;padding:10px 12px}
#exp{display:flex;gap:6px;align-items:center;background:#00c4db;border-radius:8px;padding:10px 14px}#exp svg{width:20px;height:20px}
#stage{position:static;background:#121212;display:flex;justify-content:center;align-items:center;padding:2px 0}
#vz{height:100%;width:auto;aspect-ratio:9/16;max-width:100%;border-radius:3px}
.pn{position:fixed;left:0;right:0;top:58px;bottom:calc(var(--tbh) + env(safe-area-inset-bottom));z-index:5}
.pn.s{top:auto;max-height:60%;border-radius:16px 16px 0 0;border-top:1px solid #333}
#tr{position:relative;height:50px;padding:0 14px}#pl{position:absolute;left:50%;transform:translateX(-50%)}#pl svg{width:32px;height:32px}
#tl{height:clamp(150px,32vh,240px)}
#tb{height:var(--tbh);align-items:center;padding:0 6px;border:0}
.tbn{flex:0 0 78px;gap:6px;font-size:11.5px;color:#e6e6e6}.tbn svg{width:26px;height:26px}
.tbn.bk{flex:0 0 46px;background:#2a2a2d;border-radius:6px;height:60px;margin-right:8px}
#toast{position:fixed;left:50%;bottom:calc(var(--tbh) + 70px);transform:translateX(-50%);background:#000d;border:1px solid #444;padding:9px 14px;border-radius:20px;opacity:0;transition:.3s;z-index:20;pointer-events:none}
.plat{touch-action:none}.ph .qr{padding:6px 12px;margin-left:auto;margin-right:8px}
.arr{background:linear-gradient(#34363b,#26282c 40%,#1d1f22);border:1px solid #4a4d54;border-radius:12px;padding:8px;box-shadow:inset 0 1px 0 #ffffff22,0 4px 12px #000a;margin-bottom:6px}
.lcd{background:#0a0d18;border:3px solid #1c1f26;border-radius:6px;overflow:hidden;margin-bottom:8px}
.lt{display:flex;justify-content:space-between;background:linear-gradient(#ff8a1f,#e5640a);color:#fff;font-weight:700;padding:2px 8px;font-size:12px}
.lgd{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px}
.lc{background:linear-gradient(#17325f,#0f2244);padding:5px 8px;border-radius:3px;position:relative;min-height:44px}
.lc.u2{background:linear-gradient(#173f5f,#0f2e44)}
.lc.lw{grid-column:1/3;background:linear-gradient(#4a1010,#2d0a0a);min-height:34px}
.lc i{position:absolute;right:6px;top:3px;font-style:normal;font-size:9px;color:#8fb4ff}
.lc b{display:block;color:#6fc6ff;font-size:14px}.lc.lw b{color:#ff9a7a;font-size:12px}.lc small{color:#c9d6ee;font-size:10px}.lc em{font-style:normal;color:#fff}
.ctl{display:flex;flex-direction:column;gap:6px}
.cr{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#00000033;border-radius:8px;padding:5px 6px}
.cr>span{font-size:10px;font-weight:700;color:#ffb100;width:52px;letter-spacing:.5px}
.cr select{flex:1;min-width:96px;background:#3b3e45;border:1px solid #555}
.cr button{background:linear-gradient(#5a5d64,#3a3d43);border:1px solid #20222a;box-shadow:0 2px 0 #0008}
.snp{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.snb{background:linear-gradient(#5a5d64,#3a3d43);border:1px solid #20222a;border-radius:6px;font-size:10px;padding:9px 2px;box-shadow:0 2px 0 #0008;position:relative;line-height:1.15}
.snb.on{background:linear-gradient(#0aa9bb,#066e7b);box-shadow:0 0 10px #00d1e0aa}
.snb.on::after{content:'';position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:#ff4a4a;box-shadow:0 0 6px #f44}
#snd-md{position:fixed;inset:0;background:#000c;z-index:60;display:flex;align-items:flex-end}
#snd-md .sm{background:#16171a;width:100%;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:10px 12px;border-top:1px solid #444}
#snd-md .sh{display:flex;justify-content:space-between;align-items:center;font-size:15px}
#snd-md .st{color:#ffb100;font-weight:700;margin:10px 0 6px}
#snd-md .sg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#snd-md .sb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;background:#2a2a2d;border:1px solid #333}
#snd-md .sb small{color:#8b8b90;font-size:10px;line-height:1.25}
#snd-md .sb.on{background:#0a5f6b;border-color:#00d1e0}
#snd-md .ok{width:100%;background:linear-gradient(90deg,#00d1e0,#8b5cf6,#fe2c55);color:#fff;font-weight:800;font-size:15px;padding:14px;margin:12px 0 6px;border-radius:12px}
</style></head><body>
<div id="top"><button class="ic" id="x"></button><div class="sp"></div>
<select id="q"><option value="44100,16">44.1k · 16bit</option><option value="48000,16" selected>48k · 16bit</option><option value="48000,24">48k · 24bit</option><option value="96000,24">96k · 24bit</option></select>
<button id="exp"></button></div>
<div id="stage"><canvas id="vz"></canvas>
<div class="pn s" id="p-audio" data-t="Audio · Record">
<div class="row"><button class="big" id="rec">● Record</button><select id="rs"><option value="mic">Mic</option><option value="inst">Instruments only</option><option value="mix">Instruments + Mix</option></select><button id="imb">＋ Import</button><input type="file" id="imp" accept="audio/*" hidden></div>
<label>Input level <input type="range" id="ig" min="0" max="2" step=".05" value="1"></label>
<label>Peak <meter id="mt" min="0" max="1" value="0" style="flex:1"></meter></label>
<div class="row"><label><input type="checkbox" id="me"> Metronome</label><label>BPM <input type="number" id="bpm" value="100" step=".1" style="width:78px"></label></div>
<label>Latency fix (ms) <input type="range" id="lat" min="0" max="300" value="0"></label><small style="color:#8b8b90">Noise reduction on. Use headphones. Recording lands on the selected track. Latency auto-compensated.</small></div>
<div class="pn" id="p-drum" data-q="3" data-t="Drum Pad · Sequencer">
<div class="row"><label><input type="checkbox" id="nr"> Note Repeat</label><label>Pitch <input type="range" id="dp" min=".5" max="2" step=".05" value="1"></label></div>
<div class="pads" id="pads"></div>
<div class="row"><button id="sq">▶ Seq</button><label>BPM <input type="range" id="sb" min="60" max="180" value="100"></label><label>Swing <input type="range" id="sw" min="0" max=".5" step=".05" value="0"></label><select id="spr"><option>Pattern…</option><option>Four-on-floor</option><option>Hip-hop</option><option>Trap</option><option>Clear</option></select></div><div id="seq"></div></div>
<div class="pn" id="p-keys" data-q="2" data-t="Keyboard · Arranger">
<div class="arr">
<div class="lcd"><div class="lt"><span>Main Page</span><span id="l-ch">&lt;no chord&gt;</span></div>
<div class="lgd"><div class="lc"><i>UP 1</i><b id="l-u1"></b><small>octave <em id="l-o1">0</em> · vol <em id="l-v1">100</em></small></div>
<div class="lc u2"><i>UP 2</i><b id="l-u2"></b><small>octave <em id="l-o2">0</em> · vol <em id="l-v2">80</em></small></div>
<div class="lc lw"><i>SET</i><b id="l-st"></b><small id="l-sm"></small></div></div></div>
<div class="ctl">
<div class="cr"><span>UPPER 1</span><select id="ks1"></select><button id="o1m">−</button><button id="o1p">+</button><label>Vol<input type="range" id="kv1" min="0" max="100" value="100"></label></div>
<div class="cr"><span>UPPER 2</span><select id="ks2"></select><button id="o2m">−</button><button id="o2p">+</button><label>Vol<input type="range" id="kv2" min="0" max="100" value="80"></label></div>
<div class="snp" id="snpads"></div>
<div class="cr"><span>SCALE</span><select id="ksc"><option value="off">Scale off</option><option value="major">Major</option><option value="minor">Minor</option></select><select id="kr"></select><select id="kc"><option value="off">Chord off</option><option>maj</option><option>min</option><option>7th</option></select><select id="kt"></select></div>
<div class="cr"><span>PLAY</span><label><input type="checkbox" id="ka"> Arp</label><label><input type="checkbox" id="kh"> Hold</label><label><input type="checkbox" id="ktc" checked> Touch</label><label>Bend <input type="range" id="kbd" min="-2" max="2" step=".01" value="0"></label><button id="kl">◀</button><button id="kn">▶</button></div>
<div class="cr"><span>SOUND</span><label>Atk<input type="range" id="kat" min=".001" max="1.5" step=".001" value=".01"></label><label>Rel<input type="range" id="krl" min=".02" max="3" step=".01" value=".25"></label><label>Tone<input type="range" id="kcf" min="200" max="9000" value="3000"></label><button id="kos">Reset</button></div>
</div></div>
<div id="kw"><div id="kk"></div></div></div>
<div class="pn" id="p-gt" data-q="1" data-t="Guitar">
<div class="row"><button id="sd">Strum ↓</button><button id="su">Strum ↑</button><select id="gc"><option value="">Open</option></select><select id="gcp"></select><select id="gtu"><option value="0">Standard</option><option value="1">Drop D</option><option value="2">Open G</option></select><select id="gsn"><option value="-1">Sound: Classic</option></select><select id="gp"><option value="n">Neck</option><option value="b">Bridge</option></select></div>
<div class="row"><label>Sustain<input type="range" id="gsu" min=".2" max="4" step=".1" value="1.6"></label><label>Strum<input type="range" id="gss" min="10" max="150" value="45"></label><label><input type="checkbox" id="gmu"> Palm mute</label></div><div class="fret" id="fret"></div></div>
<div class="pn" id="p-dj" data-q="0" data-t="DJ"><div id="decks"></div><label style="margin-top:8px">A <input type="range" id="cf" min="0" max="1" step=".01" value=".5"> B</label></div>
<div class="pn" id="p-rb" data-q="0" data-t="Ribbon Controller"><div class="row"><label><input type="checkbox" id="snp"> Snap to notes</label><select id="rwf"><option>sawtooth</option><option>sine</option><option>square</option><option>triangle</option></select></div><div id="rib"><div id="dot"></div></div><small style="color:#8b8b90">Slide ↔ pitch · ↕ filter · multi-effect via Effects</small></div>
<div class="pn" id="p-fx" data-t="Effects · 25 tools"><div class="row"><label>Master <input type="range" id="mv" min="0" max="1.2" step=".01" value=".9"></label><button id="fr">Reset</button></div><div id="fx"></div></div>
<div class="pn s" id="p-mix" data-t="Mixer"><div id="mix"></div></div>
<div class="pn s" id="p-exp" data-t="Export ready"><audio id="ea" controls style="width:100%;margin:8px 0"></audio><div class="row"><a id="dl" download="naol-studio.wav" style="background:#00c4db;color:#000;font-weight:700;padding:10px 16px;border-radius:8px;text-decoration:none">⬇ Download WAV</a><button id="sh">Share / Save</button></div><small id="ei" style="color:#8b8b90"></small></div>
<div class="pn s" id="p-clip" data-t="Clip options"><label>Volume <input type="range" id="cvv" min="0" max="2" step=".05" value="1"></label><label>Fade in <input type="range" id="cfi" min="0" max="3" step=".1" value="0"></label><label>Fade out <input type="range" id="cfo" min="0" max="3" step=".1" value="0"></label><div class="row"><button id="crv">⇄ Reverse</button></div></div>
</div>
<div id="tr"><button class="ic" id="fs"></button><button class="ic" id="pl"></button><span style="display:flex"><button class="ic" id="un"></button><button class="ic" id="re"></button></span></div>
<canvas id="tl"></canvas><div id="tb"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),N=n=>440*2**((n-69)/12);
let idest,ac,R,dest,an,an2,nb,OFF=0,ig,rc=null,mi,sel=null,cur=0,playing=false,srcs=[],t0=0,zoom=50,ph=0,ps=0;
const T=['Vocal','Guitar','Keys','Drums'].map(n=>({n,c:[],vol:1,pan:0,mu:0,so:0}));
const cv=f=>{const c=new Float32Array(2048);for(let i=0;i<2048;i++)c[i]=f(i/1024-1);return c};
const WS=f=>{const n=ac.createWaveShaper();n.curve=cv(f);return n};
const G=()=>ac.createGain(),F=(t,f,q)=>{const n=ac.createBiquadFilter();n.type=t;n.frequency.value=f;if(q)n.Q.value=q;return n},
D=m=>{const n=ac.createDelay(2);n.delayTime.value=m;return n},
O=(t,f)=>{const o=ac.createOscillator();o.type=t;o.frequency.value=f;o.start();return o},
C=(th,r,at)=>{const c=ac.createDynamicsCompressor();c.threshold.value=th;c.ratio.value=r;if(at!=null)c.attack.value=at;return c},
LF=(o,d,p)=>{const g=G();g.gain.value=d;o.connect(g);g.connect(p);return g};
const ins=(a,b,s)=>{const i=G(),o=G();i.connect(a);b.connect(o);return{i,o,s}},
wet=(a,b,s)=>{const i=G(),o=G(),d=G(),w=G();w.gain.value=0;i.connect(d);d.connect(o);i.connect(a);b.connect(w);w.connect(o);return{i,o,s:v=>{w.gain.value=v;s&&s(v)}}};
const GT=low=>{const a=ac.createAnalyser(),g=G(),i=G(),o=G(),b=new Float32Array(256);let th=0;i.connect(a);i.connect(g);g.connect(o);
if(!OFF)setInterval(()=>{if(!th){g.gain.value=1;return}a.getFloatTimeDomainData(b);let s=0;for(const x of b)s+=x*x;g.gain.setTargetAtTime(Math.sqrt(s/256)<th?low:1,ac.currentTime,.03)},30);
return{i,o,s:v=>th=OFF?0:v*.1}};
const PS=q=>{const d=D(.06),o=O('sawtooth',10),g=LF(o,0,d.delayTime);return ins(d,d,v=>{const s=q?Math.round(v):v;g.gain.value=-(2**(s/12)-1)/20})};
// 25 effects: [name, builder, min, max, step]
const MK=[
['Equalizer',()=>{const f=F('peaking',3000,1);return ins(f,f,v=>f.gain.value=v*15)}],
['Compressor',()=>{const c=C(0,6);return ins(c,c,v=>c.threshold.value=-v*50)}],
['Reverb',()=>{const c=ac.createConvolver(),n=ac.sampleRate*2,b=ac.createBuffer(2,n,ac.sampleRate);for(let k=0;k<2;k++){const d=b.getChannelData(k);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n)**3}c.buffer=b;return wet(c,c)}],
['Delay',()=>{const d=D(.3),f=G();f.gain.value=.4;d.connect(f);f.connect(d);return wet(d,d)}],
['Limiter',()=>{const c=C(0,20,0);c.knee.value=0;return ins(c,c,v=>c.threshold.value=-v*24)}],
['De-Esser',()=>{const f=F('peaking',6500,3);return ins(f,f,v=>f.gain.value=-v*18)}],
['Noise Gate',()=>GT(.02)],
['Auto-Tune (lite)',()=>PS(1),-12,12,1],
['Pitch Shifter',()=>PS(0),-12,12,.1],
['Chorus',()=>{const d=D(.025),o=O('sine',1.5);LF(o,.004,d.delayTime);return wet(d,d)}],
['Distortion',()=>{const s=WS(x=>x);return wet(s,s,v=>s.curve=cv(x=>Math.max(-1,Math.min(1,x*(1+v*30)))))}],
['Saturation',()=>{const s=WS(x=>x);return wet(s,s,v=>s.curve=cv(x=>Math.tanh(x*(1+v*4))))}],
['Flanger',()=>{const d=D(.003),o=O('sine',.25),f=G();f.gain.value=.6;LF(o,.002,d.delayTime);d.connect(f);f.connect(d);return wet(d,d)}],
['Phaser',()=>{const o=O('sine',.5),a=[0,1,2,3].map(()=>F('allpass',800,2));a.forEach((n,k)=>{LF(o,600,n.frequency);if(k)a[k-1].connect(n)});return wet(a[0],a[3])}],
['Expander',()=>GT(.4)],
['Transient Shaper',()=>{const c=C(-30,8,.05);return wet(c,c)}],
['Multiband Comp',()=>{const a=G(),b=G();[F('lowpass',300),F('bandpass',1200,.7),F('highpass',3500)].forEach(f=>{const c=C(-30,6);a.connect(f);f.connect(c);c.connect(b)});return wet(a,b)}],
['Graphic EQ',()=>{const f=[100,400,1200,3500,9000].map(x=>F('peaking',x,1)),g=[9,4,-3,4,9];f.forEach((n,k)=>k&&f[k-1].connect(n));return ins(f[0],f[4],v=>f.forEach((n,k)=>n.gain.value=v*g[k]))}],

/* ===================== NAOL STUDIO · MELODY FOLLOWER v1 =====================
   Nothing in your existing code is removed. It only upgrades the AI Keys / Full Auto:
   - YIN pitch tracker (hop 128 samples ≈ 5.8 ms, parabolic interpolation → sub-cent pitch)
   - Note segmentation (pitch change, re-attack, silence) + onset refinement down to 8 samples (~0.36 ms)

const mkNoise=oc=>{const sr=oc.sampleRate,b=oc.createBuffer(1,sr,sr),d=b.getChannelData(0);for(let i=0;i<sr;i++)d[i]=Math.random()*2-1;return b};
async function follow(){
